spring.application.name=demo
server.port=8081

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/billing
spring.datasource.username=postgres
spring.datasource.password=peter
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true   # <- only if starting on a non-empty DB

# --- MyBatis ---
# --- MyBatis ---
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath*:/customer/*Mapper.xml
mybatis.type-aliases-package=com.example.demo.customer

# TEMP: debug logs to confirm XML loading
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG


# (Optional) MyBatis debug if you want to verify the XML is loaded
# logging.level.org.mybatis=DEBUG
# logging.level.org.apache.ibatis=DEBUG

# --- Devtools (optional) ---
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
